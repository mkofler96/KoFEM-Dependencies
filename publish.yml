name: build-and-publish

on:
  push:
    tags: ['v*']            # v1.0.0 -> publishes :1.0.0, :1.0, and :latest
    branches: ['main']      # main    -> publishes :main (rolling)
  workflow_dispatch: {}     # manual runs from the Actions tab

permissions:
  contents: read
  packages: write           # required to push to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}   # ghcr.io/OWNER/kofem-wasm-deps

jobs:
  build:
    runs-on: ubuntu-latest
    # First build (cold cache) compiles OCCT and can take a few hours. The
    # GitHub-hosted runner hard limit is 6h; if you bump it past that, switch to
    # a larger/self-hosted runner. Warm builds (registry cache hit) are minutes.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest=auto adds :latest automatically on semver tag pushes.
          flavor: latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed layer cache so warm builds skip the OCCT/Netgen/MFEM
          # layers entirely. mode=max caches intermediate layers too.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
